name: Data
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/data/**", "requirements-data.txt", ".github/workflows/data.yml"]
  pull_request:
    paths: ["data/**", "scripts/data/**", "requirements-data.txt", ".github/workflows/data.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pip install -r requirements-data.txt
      - name: Rebuild from source snapshots
        run: python scripts/data/build.py
      - name: Committed data matches a fresh build
        run: git diff --exit-code -- data/
      - name: Validate
        run: python scripts/data/validate.py
