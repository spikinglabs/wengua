name: Core
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Packages carry the current dataset
        run: python scripts/mcp_spec.py && python scripts/sync_data.py && git diff --exit-code
      - name: Shared test vectors are up to date
        run: python scripts/make_vectors.py && git diff --exit-code spec/

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q

  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run build

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: The skill runs with no install
        working-directory: skills/wengua
        run: |
          python scripts/run.py cast --json -q test > /dev/null
          python scripts/run.py read 7 8 9 7 6 8 > /dev/null
          python scripts/run.py lookup 乾為天
      - name: Package the skill
        run: python scripts/package_skill.py wengua-skill.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wengua-skill
          path: wengua-skill.zip

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: mkdir -p ../site && echo ok > ../site/index.html
      - run: npm ci
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir dist
