    <rect x="112" y="100" width="124" height="36" rx="8"/><rect x="276" y="100" width="124" height="36" rx="8"/>
    <rect x="112" y="162" width="124" height="36" rx="8"/><rect x="276" y="162" width="124" height="36" rx="8"/>
    <rect x="112" y="224" width="124" height="36" rx="8"/><rect x="276" y="224" width="124" height="36" rx="8"/>
    <rect x="112" y="286" width="288" height="36" rx="8"/>
    <rect x="112" y="348" width="124" height="36" rx="8"/><rect x="276" y="348" width="124" height="36" rx="8"/>
    <rect x="112" y="410" width="124" height="36" rx="8"/><rect x="276" y="410" width="124" height="36" rx="8"/>
  </g>
</svg>
