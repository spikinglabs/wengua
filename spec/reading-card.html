<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wengua reading</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#fffdf8, #17150f));
    --fg: var(--color-text-primary, light-dark(#1d1a14, #f3efe4));
    --muted: var(--color-text-secondary, light-dark(#6b6457, #a9a08d));
    --line: var(--color-border-primary, light-dark(#e6dfcf, #3a352a));
    --accent: light-dark(#9b2c1f, #e0786a);
    --font: var(--font-sans, system-ui, -apple-system, "PingFang TC", "Noto Sans CJK TC", sans-serif);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font); }
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .hex { display: flex; flex-direction: column; gap: 6px; width: 96px; }
  .bar { height: 10px; display: flex; gap: 14px; position: relative; }
  .bar i { flex: 1; background: var(--fg); border-radius: 2px; }
  .bar.changing i { background: var(--accent); }
  .bar.changing::after { content: attr(data-mark); position: absolute; right: -22px; top: -6px; color: var(--accent); font-size: 13px; }
  .pair { display: flex; gap: 32px; align-items: center; }
  .arrow { color: var(--muted); font-size: 22px; }
  .name { font-size: 20px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .texts { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .rule { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .t { margin: 10px 0; }
  .t .label { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .t .role { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .t.principal .zh { font-size: 17px; }
  .bar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  button { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  .test { color: var(--accent); font-size: 12px; }
  .foot { margin-top: 12px; color: var(--muted); font-size: 12px; }
  #empty { color: var(--muted); }
  .ver { font-size: 11px; opacity: .6; }
</style>
</head>
<body>
<div id="empty">正在起卦… Casting… <span class="ver">card 3</span></div>
<div id="card" hidden>
  <div class="bar-top"><span class="sub" id="question"></span><button id="script" type="button">简体</button></div>
  <div class="row" id="hexes"></div>
  <div class="texts" id="texts"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(() => {
  let script = "zh_hant", reading = null, nextId = 1;
  const $ = (id) => document.getElementById(id);
  const send = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function drawHex(bits, values) {
    let html = '<div class="hex">';
    for (let i = 5; i >= 0; i--) {
      const yang = bits[i] === "1";
      const v = values ? values[i] : null;
      const changing = v === 6 || v === 9;
      html += `<div class="bar${changing ? " changing" : ""}" data-mark="${v === 9 ? "○" : v === 6 ? "✕" : ""}">` +
        (yang ? "<i></i>" : "<i></i><i></i>") + "</div>";
    }
    return html + "</div>";
  }
  function title(h) {
    return `<div><div class="name">${esc(h.unicode)} ${esc(h.name[script])}</div>` +
      `<div class="sub">${h.number} · ${esc(h.name.pinyin)} · ${esc(h.name.en)}</div></div>`;
  }
  function render() {
    const r = reading;
    if (!r || !r.primary) return;
    $("empty").hidden = true; $("card").hidden = false;
    $("question").textContent = r.question || "";
    let hexes = '<div class="pair">' + drawHex(r.primary.binary, r.values) + title(r.primary) + "</div>";
    if (r.relating) hexes += '<span class="arrow">→</span><div class="pair">' + drawHex(r.relating.binary) + title(r.relating) + "</div>";
    $("hexes").innerHTML = hexes;
    const s = r.selection;
    const roles = { principal: "主", supporting: "輔", zhen: "貞", hui: "悔", context: "", changing: "", outcome: "" };
    $("texts").innerHTML = `<div class="rule">${esc(s.explanation[script])}<br>${esc(s.explanation.en)}</div>` +
      s.texts.map((t) => `<div class="t ${esc(t.role)}"><span class="label">${t.hexagram === r.primary.number ? "" : esc((r.relating || {}).name?.[script] || "") + " "}${esc(t.label ? t.label[script] : (script === "zh_hant" ? "卦辭" : "卦辞"))}</span>` +
        `<span class="zh">${esc(t.text[script])}</span>${roles[t.role] ? `<span class="role">${roles[t.role]}</span>` : ""}</div>`).join("");
    const a = r.audit || {};
    $("foot").innerHTML = `${esc(r.method)} · ${esc(a.dataset)}${a.test ? ' · <span class="test">TEST 測試</span>' : ""}`;
    $("script").textContent = script === "zh_hant" ? "简体" : "繁體";
    document.documentElement.lang = script === "zh_hant" ? "zh-Hant" : "zh-Hans";
    reportSize();
  }
  function reportSize() {
    // Measure the content, not the frame: the frame's own height would never let the card shrink.
    const box = document.body.getBoundingClientRect();
    send({ method: "ui/notifications/size-changed", params: { width: Math.ceil(box.width), height: Math.ceil(box.height) } });
  }
  $("script").addEventListener("click", () => { script = script === "zh_hant" ? "zh_hans" : "zh_hant"; render(); });

  // MCP Apps (2026-01-26): initialize, then initialized; the host sends
  // tool-input and tool-result only after it has seen initialized.
  let initialized = false;
  function markInitialized() {
    if (initialized) return;
    initialized = true;
    send({ method: "ui/notifications/initialized", params: {} });
  }
  function applyHostContext(ctx) {
    const v = (ctx && ctx.styles && ctx.styles.variables) || {};
    for (const [k, val] of Object.entries(v)) if (val) document.documentElement.style.setProperty(k, val);
  }
  function readingFrom(result) {
    if (!result) return null;
    if (result.structuredContent && result.structuredContent.primary) return result.structuredContent;
    for (const c of result.content || []) {
      if (c && c.type === "text") { try { const r = JSON.parse(c.text); if (r && r.primary) return r; } catch (_) {} }
    }
    return null;
  }

  window.addEventListener("message", (event) => {
    const m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.method === "ui/notifications/tool-result") {
      const r = readingFrom(m.params);
      if (r) { reading = r; if (/hans/i.test(r.locale || "")) script = "zh_hans"; render(); }
    } else if (m.method === "ui/notifications/host-context-changed") {
      applyHostContext(m.params);
    } else if (m.method && m.id !== undefined) {
      // Requests from the host (ui/resource-teardown, ping): acknowledge.
      window.parent.postMessage({ jsonrpc: "2.0", id: m.id, result: {} }, "*");
    } else if (m.id === 1) {
      // Our ui/initialize. Go on even if the host returned an error.
      if (m.result) applyHostContext(m.result.hostContext);
      markInitialized();
    }
  });
  send({ id: nextId++, method: "ui/initialize", params: {
    protocolVersion: "2026-01-26",
    appInfo: { name: "wengua-reading-card", version: "0.1.1" },
    clientInfo: { name: "wengua-reading-card", version: "0.1.1" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  } });
  // Some hosts never answer ui/initialize; don't wait forever.
  setTimeout(markInitialized, 1500);
  // If no result arrives, say where the reading is instead of spinning.
  setTimeout(() => { if (!reading) $("empty").textContent = "卦象見下文。The reading is in the reply below. (card 3)"; }, 12000);
  new ResizeObserver(reportSize).observe(document.body);
})();
</script>
</body>
</html>
