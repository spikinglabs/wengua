  { "Get started" = [
    "setup/index.md",
    { "Claude" = "setup/claude.md" },
    { "ChatGPT" = "setup/chatgpt.md" },
    { "Codex" = "setup/codex.md" },
    { "Gemini" = "setup/gemini.md" },
    { "GitHub Copilot" = "setup/copilot.md" },
    { "Cursor" = "setup/cursor.md" },
    { "Other clients" = "setup/other.md" },
    { "APIs and libraries" = "setup/api.md" },
  ] },
  { "Ecosystem" = [
    "ecosystem/index.md",
    { "Dataset" = "ecosystem/dataset.md" },
    { "Core library" = "ecosystem/core.md" },
    { "Agent Skill" = "ecosystem/skill.md" },
    { "MCP server" = "ecosystem/mcp.md" },
    { "Reading card (MCP App)" = "ecosystem/card.md" },
    { "CLI" = "ecosystem/cli.md" },
  ] },
  { "Design" = "design.md" },
