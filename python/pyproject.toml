[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wengua"
version = "0.1.0"
description = "Wengua 问卦: the accurate, open I Ching (易经) for every AI. Fair casting, sourced Chinese text, MCP server and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "DATA_LICENSE"]
keywords = ["i-ching", "yijing", "易经", "周易", "hexagram", "mcp", "divination", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Chinese (Traditional)",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: English",
  "Topic :: Religion",
]
dependencies = []

[project.urls]
Homepage = "https://wengua.allo.land/"
Source = "https://github.com/spikinglabs/wengua"

[project.scripts]
wengua = "wengua.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/wengua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
